# ===========================================================================
# 基岩端口片段（ADR-036）——只在「代理托管基岩」时由 compose_cmd 追加 -f：
#   geyser_target() == velocity  ⇔  ENABLE_VELOCITY=true 且 EAGLER_GEYSER≠false
#
# 为什么单独一个文件：compose 的 ports 无法按 .env 条件生成。若把 19132/19134
# 写在基础 compose.yaml 里，velocity-only 拓扑（ENABLE_EAGLER=false、基岩由实例侧
# Geyser-Spigot 托管）会和实例抢同一个宿主端口。
#
# 端口值必须与 lib/eagler.sh 写入的 Geyser-Velocity/config.yml 一致；路由器端口号
# 不变，所以玩家侧无需改动。
#
# 覆盖的端口语义：
#   EAGLER_GEYSER_PORT        信令（TCP）+ RakNet / NetherNet 复用（UDP）
#   EAGLER_GEYSER_WEBRTC_PORT 独立媒体端口；=0 表示复用 EAGLER_GEYSER_PORT
#                             （此时由 compose.velocity-geyser-webrtc.yaml 不再追加）
# ===========================================================================
services:
  velocity:
    ports:
      - "${LAN_BIND_ADDR:-0.0.0.0}:${EAGLER_GEYSER_PORT:-19132}:${EAGLER_GEYSER_PORT:-19132}/udp"
      - "${LAN_BIND_ADDR:-0.0.0.0}:${EAGLER_GEYSER_PORT:-19132}:${EAGLER_GEYSER_PORT:-19132}/tcp"
