# ===========================================================================
# 基岩媒体端口片段（ADR-036）——只在「媒体端口与主端口分离」时追加 -f：
#   geyser_target() == velocity  且  EAGLER_GEYSER_WEBRTC_PORT ≠ 0 且 ≠ EAGLER_GEYSER_PORT
#
# 为什么单独一个文件：transport=nethernet 且 webrtc-port=0 时，媒体复用
# EAGLER_GEYSER_PORT（UDP），此时再发布一个独立端口是多余映射；而 compose 的
# ports 无法按 .env 条件生成，所以用「按需追加片段」表达。
# ===========================================================================
services:
  velocity:
    ports:
      - "${LAN_BIND_ADDR:-0.0.0.0}:${EAGLER_GEYSER_WEBRTC_PORT:-19134}:${EAGLER_GEYSER_WEBRTC_PORT:-19134}/udp"
