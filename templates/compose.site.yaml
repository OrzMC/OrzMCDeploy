# ===========================================================================
# 站点增量 override（运行时位置 $DATA_ROOT/compose.site.yaml，init 生成、绝不覆盖）
#
# 包内 compose.yaml 是运行时文件，升级换包会整体替换；站点特有增量（飞书等适配器凭据、
# 额外 env/挂载/端口）写这里：compose_cmd 检测到即自动 -f 追加，升级换包不丢（ADR-022）。
#
# 用法：把 `services: {}` 改成 `services:` 再按缩进加覆盖；值优先写 .env 再用 ${VAR}
# 引用（密钥不入库）；改完 ./orzmc.sh validate && ./orzmc.sh up。
# 合并语义为 Compose 原生 override：同名字段后加载覆盖，environment 逐键合并，volumes 追加。
# ===========================================================================

services: {}

