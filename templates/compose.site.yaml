# ===========================================================================
# 站点增量 override（运行时位置 $DATA_ROOT/compose.site.yaml，init 生成、绝不覆盖）
#
# 包内 compose.yaml 是运行时文件，升级换包会整体替换；站点特有增量（飞书等适配器凭据、
# 额外 env/挂载/端口）写这里：compose_cmd 检测到即自动 -f 追加，升级换包不丢（ADR-022）。
#
# 用法：把 `services: {}` 改成 `services:` 再按缩进加覆盖；值优先写 .env 再用 ${VAR}
# 引用（密钥不入库）；改完 ./orzmc.sh validate && ./orzmc.sh up。
# 合并语义为 Compose 原生 override：同名字段后加载覆盖，environment 逐键合并，volumes 追加。
# ===========================================================================

services: {}

# ---- 示例（需要时解开注释）----
# services:
#   easybot:                                  # 值填 .env：FEISHU_APP_ID / FEISHU_APP_SECRET
#     environment:
#       FEISHU_APP_ID: "${FEISHU_APP_ID}"
#       FEISHU_APP_SECRET: "${FEISHU_APP_SECRET}"
#   mcsmanager-web:
#     volumes:
#       - "${DATA_ROOT}/site/extra:/opt/mcsmanager/web/extra:ro"
#
# ---- Eaglercraft 的 WSS 入口（EAGLER_MODE≠off 时，ADR-035）----
# TLS 反代归站点：仓库只生成片段（$DATA_ROOT/eagler/caddy-eagler.snippet），
# 这里只加一个端口映射，把「对外 WSS 端口」接到容器内 Caddy 的 8443。
# 片段内容见该文件；路由器还要把同一端口转发到宿主，防火墙按站点自建 TLS 规则放行。
#   caddy:
#     ports:
#       - "18444:8443"
