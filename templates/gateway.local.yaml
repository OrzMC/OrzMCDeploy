# ===========================================================================
# EasyBot 本地覆盖（gateway.local.yaml）
#
# init 生成到 $DATA_ROOT/easybot/data/（与 compose.site.yaml 一样绝不覆盖已有文件），
# EasyBot 从 EASYBOT_HOME 读取并作为 gateway.yaml 的覆盖层合并（≥0.0.35，仅按显式键合并）。
# 个人微信适配器无需凭据即自动启用（空转刷码），此处显式禁用；要接入微信请删除本文件。
# ===========================================================================

adapters:
  wechat:
    enabled: false
