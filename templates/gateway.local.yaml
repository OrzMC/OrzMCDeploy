# ===========================================================================
# EasyBot 本地覆盖（gateway.local.yaml）
#
# init 生成到 $DATA_ROOT/easybot/data/（与 compose.site.yaml 一样绝不覆盖已有文件），
# EasyBot 从 EASYBOT_HOME 读取并作为 gateway.yaml 的覆盖层合并（≥0.0.35，仅按显式键合并）。
#
# 模板刻意**不写**任何 adapters 覆盖（本文件只是占位 + 说明这个挂载点）：
#   - 微信（个人微信，扫码登录）在 EasyBot 里是 opt-in：不写就不启用，要接入才显式开启。
#   - 写 `enabled: false` 取消某个适配器也是支持的（EasyBot 0.0.47 起；0.0.46 有个
#     已修的回归会把显式禁用的适配器重新拉起，仓库锁定的 digest 已是 0.0.47）。
#
# 要接入微信：解除下面注释（显式开启），然后 docker restart orzmc-easybot。
# adapters:
#   wechat:
#     enabled: true
# ===========================================================================
