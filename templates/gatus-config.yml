# ===========================================================================
# OrzMC 统一状态页（Gatus）配置模板
#
# init 时由 lib/common.sh 的 ensure_status_config 按 profile 替换占位符，生成到
# $DATA_ROOT/status/config.yaml。与 Caddyfile 一样**绝不覆盖已有文件**（用户可自行
# 增删 endpoints/buttons；改域名后需删除已落盘文件再 init 重新生成）。
#
# 占位符分工：
#   __MCS_WEB_BASE__ / __EASY_ADMIN_BASE__ / __MCS_NODE_LINK__ —— 页头按钮链接
#       （面向真实用户浏览器；prod/local=https 域名，lan=http://<LAN_HOST_IP>:<LAN_*_PORT>）
#   __MCS_WEB_ENDPOINT__ / __EASY_ADMIN_ENDPOINT__            —— 健康检查端点 URL
#       （prod/local=同上真实入口，可测可达性；lan=内网 URL http://mcsmanager-web:23333
#       等——gatus 容器经宿主真实 LAN IP 访问发布端口会超时，见 ADR-012）
#   __TLS_INSECURE__                                          —— 客户端 TLS 校验开关
#   __STATUS_PORT__                                           —— 状态页自身端口
#
# 各 profile 下占位符取值：
#   - prod ：三 base = https://<真实域名>；两 endpoint = 同 base；__TLS_INSECURE__=false
#   - local：三 base = https://<域名>:<PROXY_HTTPS_PORT>（.localhost）；两 endpoint = 同 base；
#            __TLS_INSECURE__=true
#   - lan  ：三 base = http://<LAN_HOST_IP>:<LAN_*_PORT>；两 endpoint = 内网 URL（进程存活）；
#            __TLS_INSECURE__=false
# daemon / MariaDB / 状态页自检 / PaperMC 实例走内网（进程存活），与 profile 无关。
# lan 下按钮的 MCSManager Daemon 仅作 daemon API 入口（key 鉴权），浏览器「网页直连」
# 终端不可用（ADR-011）。
# 页面无鉴权、不含密钥（仅服务名与状态）；如需登录可后续加 security 块。
# ===========================================================================

web:
  port: __STATUS_PORT__

ui:
  header: "OrzMC 平台状态"
  dashboard-heading: "平台层服务健康"
  dashboard-subheading: "统一首页 · 实时健康监测（Gatus）"
  buttons:
    - name: "MCSManager 面板"
      link: "__MCS_WEB_BASE__"
    - name: "EasyBot 管理后台"
      link: "__EASY_ADMIN_BASE__"
    - name: "MCSManager Daemon"
      link: "__MCS_NODE_LINK__"

endpoints:
  - name: "MCSManager 面板"
    group: "平台层"
    url: "__MCS_WEB_ENDPOINT__"
    interval: 30s
    client:
      insecure: __TLS_INSECURE__
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-url: true

  - name: "EasyBot 管理后台"
    group: "平台层"
    url: "__EASY_ADMIN_ENDPOINT__/api/v1/live"
    interval: 30s
    client:
      insecure: __TLS_INSECURE__
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-url: true

  - name: "MCSManager Daemon 节点"
    group: "平台层"
    url: "tcp://mcsmanager-daemon:24444"   # 内网进程存活（不经边缘）
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    ui:
      hide-url: true

  - name: "MariaDB 数据库"
    group: "平台层"
    url: "tcp://mariadb:3306"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    ui:
      hide-url: true

  - name: "统一状态页（Gatus）"
    group: "平台层"
    url: "http://status:__STATUS_PORT__/health"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-url: true

  - name: "PaperMC 正式服"
    group: "游戏实例"
    url: "tcp://host.docker.internal:25565"   # 实例端口由 MCSManager 映射
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    ui:
      hide-url: true

  - name: "PaperMC 测试服"
    group: "游戏实例"
    url: "tcp://host.docker.internal:25566"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    ui:
      hide-url: true
