# ===========================================================================
# cloudflared 隧道配置模板（prod profile 使用）
#
# 首次 init 时由 lib/common.sh 的 ensure_cloudflared_config 用 .env 的
# CLOUDFLARE_TUNNEL_ID / DOMAIN_MCS_WEB / DOMAIN_EASY_ADMIN 替换占位符，
# 生成到 $DATA_ROOT/cloudflared/config.yml。
# 已落盘的文件是运行数据的一部分；隧道凭据 <tunnel-id>.json 与 cert.pem 同目录，
# 随 $DATA_ROOT 一起备份。
#
# 公网入口共 2 条：MCSManager 面板 + EasyBot 管理后台。
# daemon **不再单独暴露**（ADR-026）：MCSManager 10.22 起面板自身中转浏览器↔daemon
# 的数据流（SystemConfig.dataPlane=proxy），终端/控制台/文件管理都经面板端口，
# 节点地址固定内网名 ws://mcsmanager-daemon:24444。daemon key 仍属最高权限密钥
# （$DATA_ROOT/mcsmanager/daemon/data/Config/global.json），继续当密钥保管。
# 兜底规则返回 404：未匹配 hostname 的请求到此为止，不转发到任何服务。
# ===========================================================================

tunnel: __CLOUDFLARE_TUNNEL_ID__
credentials-file: /etc/cloudflared/__CLOUDFLARE_TUNNEL_ID__.json

ingress:
  - hostname: __DOMAIN_MCS_WEB__
    service: http://mcsmanager-web:23333
  - hostname: __DOMAIN_EASY_ADMIN__
    service: http://easybot:8080
  - service: http_status:404
