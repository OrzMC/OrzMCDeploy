# ===========================================================================
# OrzMC deploy 质量门禁
#
# 仓库只承载"运行时"，无构建产物；本 CI 是纯校验，不构建/不发布镜像、
# 不拉取容器镜像（docker compose config 为纯解析，无需 daemon/镜像）。
#
# 三个并行 job：
#   lint           —— shell 语法（bash -n）+ shellcheck + 模板 YAML 解析 + 禁入路径守卫
#   validate       —— 三 profile（local / lan / prod）init && validate：
#                      必需变量检查（validate_required_env）+ docker compose config -q
#   windows-branch —— Windows 分支逻辑（ADR-016）单元测试（mock uname 强制 MINGW，
#                      校验 win_path / win_daemon_* / compose_cmd Windows 分支的命令
#                      构造，不真连 Docker；详见 tests/windows_ci.sh）
#   详见 AGENTS.md 命令速查与 docs/architecture.md。
# ===========================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Shell & YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck & PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml

      - name: Bash syntax check
        run: |
          for f in *.sh lib/*.sh tests/*.sh; do
            bash -n "$f"
          done
          echo "bash -n OK"

      - name: Shellcheck
        run: shellcheck -x --shell=bash *.sh lib/*.sh tests/*.sh

      - name: YAML template parse check
        run: |
          python3 - <<'EOF'
          import glob
          import sys
          import yaml

          files = sorted(glob.glob("templates/*.yml") + glob.glob("templates/*.yaml"))
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
          print(f"yaml parse OK: {len(files)} templates")
          EOF

      - name: Forbidden paths guard (secrets/data must never be tracked)
        run: |
          bad="$(git ls-files | grep -E '(^|/)(\.env|\.env\.local|\.local-data|\.local-data-lan|\.local-backups)(/|$)' || true)"
          if [ -n "$bad" ]; then
            echo "以下禁入路径被纳入版本控制："
            echo "$bad"
            echo "（AGENTS.md 铁律：密钥与运行数据一律落 \$DATA_ROOT，永不入库）"
            exit 1
          fi
          echo "forbidden paths guard OK"

  validate:
    name: Compose config (EDGE×ENABLE 组合)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: EDGE=cloudflare 全服务 init + validate
        run: |
          # 全部为 env.prod 模板占位值（CLOUDFLARE_TUNNEL_ID=<tunnel-uuid> 等），
          # 非真实密钥；跑在 $RUNNER_TEMP 避免污染 checkout。
          ./orzmc.sh -d "$RUNNER_TEMP/orzmc-cf" -e cloudflare init
          ./orzmc.sh -d "$RUNNER_TEMP/orzmc-cf" -e cloudflare validate

      - name: EDGE=local 全服务 init + validate
        run: |
          ./orzmc.sh -d "$RUNNER_TEMP/orzmc-local" -e local init
          ./orzmc.sh -d "$RUNNER_TEMP/orzmc-local" -e local validate

      - name: EDGE=lan 全服务 init + validate
        run: |
          ./orzmc.sh -d "$RUNNER_TEMP/orzmc-lan" -e lan init
          ./orzmc.sh -d "$RUNNER_TEMP/orzmc-lan" -e lan validate

      - name: EDGE=none init + validate
        run: |
          ./orzmc.sh -d "$RUNNER_TEMP/orzmc-none" -e none init
          ./orzmc.sh -d "$RUNNER_TEMP/orzmc-none" -e none validate

      - name: EDGE=cloudflare + ENABLE 全关（仅核心服务）
        run: |
          ./orzmc.sh -d "$RUNNER_TEMP/orzmc-core" -e cloudflare init
          # 关闭全部可选服务：仅核心 web/daemon + 边缘层，验证最小集配置
          printf '\nENABLE_EASYBOT=false\nENABLE_MARIADB=false\nENABLE_STATUS=false\n' >> "$RUNNER_TEMP/orzmc-core/.env"
          ./orzmc.sh -d "$RUNNER_TEMP/orzmc-core" -e cloudflare validate
          # 断言最小集：compose config 不应含 easybot/mariadb/status
          if ./orzmc.sh -d "$RUNNER_TEMP/orzmc-core" -e cloudflare validate >/dev/null 2>&1; then
            svcs="$(docker compose --env-file "$RUNNER_TEMP/orzmc-core/.env" \
              -f compose.yaml -f compose.edge.cloudflare.yaml config --services 2>/dev/null)"
            echo "services: $svcs"
            echo "$svcs" | grep -q 'easybot' && { echo "easybot 应被禁用"; exit 1; } || true
            echo "$svcs" | grep -q 'mariadb' && { echo "mariadb 应被禁用"; exit 1; } || true
            echo "$svcs" | grep -q 'status'  && { echo "status 应被禁用"; exit 1; } || true
            echo "可选服务按 ENABLE_* 正确禁用"
          fi

      - name: 旧入口兼容（deploy.sh -p prod→cloudflare；local.sh/lan.sh 仍可用）
        run: |
          ./deploy.sh -d "$RUNNER_TEMP/orzmc-oldprod" -p prod init
          ./deploy.sh -d "$RUNNER_TEMP/orzmc-oldprod" -p prod validate

  windows-branch:
    name: Windows branch logic (ADR-016)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Windows 分支单元测试
        run: |
          bash tests/windows_ci.sh
