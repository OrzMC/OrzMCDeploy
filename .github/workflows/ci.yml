# ===========================================================================
# OrzMC deploy 质量门禁
#
# 仓库只承载"运行时"，无构建产物；本 CI 是纯校验，不构建/不发布镜像、
# 不拉取容器镜像（docker compose config 为纯解析，无需 daemon/镜像）。
#
# Jobs：
#   lint           —— bash -n + shellcheck + YAML 解析 + 可执行位/文档链接守卫 + 禁入路径守卫
#   validate       —— init && validate（必需变量 + docker compose config -q）+ 可选服务开关
#                     + LAN_*_PORT / LAN_BIND_ADDR 生效 + firewall --dry-run
#   windows-branch —— Windows 分支逻辑单元测试（mock uname 强制 MINGW，
#                     校验 win_path / win_daemon_* / compose_cmd Windows 分支的命令
#                     构造，不真连 Docker；详见 tests/windows_ci.sh）
#   package        —— 仅打 tag(v*) 时：产出 Release tarball + sha256（ADR-018）
# 详见 AGENTS.md 命令速查与 docs/architecture.md。
# ===========================================================================

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']      # 打 tag(v*) 触发（package job 据此打 Release tarball，ADR-018）
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Shell & YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck & PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml

      - name: Bash syntax check
        run: |
          for f in *.sh lib/*.sh tests/*.sh; do
            bash -n "$f"
          done
          echo "bash -n OK"

      - name: Shellcheck
        run: shellcheck -x --shell=bash *.sh lib/*.sh tests/*.sh

      - name: YAML parse check（templates + compose + CI）
        run: |
          python3 - <<'EOF'
          import glob
          import sys
          import yaml

          files = sorted(glob.glob("templates/*.yml") + glob.glob("templates/*.yaml"))
          files += ["compose.yaml", ".github/workflows/ci.yml"]
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
          print(f"yaml parse OK: {len(files)} files")
          EOF

      - name: Executable bits（入口脚本必须有 +x）
        run: |
          bad=0
          for f in orzmc.sh deploy.sh backup.sh restore.sh install.sh \
                   update-image-digests.sh lib/firewall.sh tests/docs_check.sh; do
            mode="$(git ls-files -s "$f" | awk '{print $1}')"
            if [ "$mode" != "100755" ]; then
              echo "!! $f 模式为 ${mode:-缺失}（应为 100755）"
              bad=1
            fi
          done
          exit "$bad"

      - name: Markdown links & anchors
        run: bash tests/docs_check.sh

      - name: Forbidden paths guard (secrets/data must never be tracked)
        run: |
          # 含旧版本遗留目录名（.env.local/.local-data-lan）：现在 .gitignore 不再列它们，
          # 这里继续拦截，防止老 checkout 的残留被误提交。
          bad="$(git ls-files | grep -E '(^|/)(\.env|\.env\.local|\.local-data|\.local-data-lan|\.local-backups)(/|$)' || true)"
          if [ -n "$bad" ]; then
            echo "以下禁入路径被纳入版本控制："
            echo "$bad"
            echo "（AGENTS.md 铁律：密钥与运行数据一律落 \$DATA_ROOT，永不入库）"
            exit 1
          fi
          echo "forbidden paths guard OK"

  validate:
    name: Compose config (init + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: init + validate（模板全量）
        run: |
          # 模板占位值，非真实密钥；跑在 $RUNNER_TEMP 避免污染 checkout。
          ./orzmc.sh -d "$RUNNER_TEMP/orzmc" init
          ./orzmc.sh -d "$RUNNER_TEMP/orzmc" validate

      - name: ENABLE_EASYBOT 关闭（仅核心服务）
        run: |
          d="$RUNNER_TEMP/orzmc-core"
          ./orzmc.sh -d "$d" init
          # 必须原地改已有键：read_env_value 是「首次出现优先」，追加同名行会被忽略
          sed -i 's/^ENABLE_EASYBOT=.*/ENABLE_EASYBOT=false/' "$d/.env"
          ./orzmc.sh -d "$d" validate
          # 断言开关真的生效（enabled_profiles 为空，即 compose_cmd 不会追加 --profile）
          profiles="$(bash -c 'source lib/common.sh; DATA_ROOT="'"$d"'"; enabled_profiles')"
          [ -z "$profiles" ] || { echo "!! ENABLE_EASYBOT=false 仍输出 profile: $profiles"; exit 1; }
          # 走 compose_cmd 实际构造（注意：不要直接传 --profile easybot，那会强制启用）
          svcs="$(bash -c 'source lib/common.sh; DATA_ROOT="'"$d"'"; compose_cmd config --services')"
          echo "services: $svcs"
          if echo "$svcs" | grep -q '^easybot$'; then
            echo "!! easybot 应被 ENABLE_EASYBOT=false 禁用"; exit 1
          fi
          echo "可选服务按 ENABLE_EASYBOT 正确禁用"

      - name: 局域网端口随 LAN_*_PORT 生效
        run: |
          printf 'LAN_MCS_WEB_PORT=19090\nLAN_EASYBOT_PORT=19091\n' >> "$RUNNER_TEMP/orzmc/.env"
          docker compose --env-file "$RUNNER_TEMP/orzmc/.env" -f compose.yaml \
            --profile easybot config 2>/dev/null | grep -E 'published: "1909[01]"' | sort -u

      - name: 绑定地址随 LAN_BIND_ADDR 生效（ADR-028 L2）
        run: |
          d="$RUNNER_TEMP/orzmc-bind"
          ./orzmc.sh -d "$d" init
          sed -i 's/^LAN_BIND_ADDR=.*/LAN_BIND_ADDR=127.0.0.1/' "$d/.env"
          got="$(docker compose --env-file "$d/.env" -f compose.yaml --profile easybot config \
            | grep -c 'host_ip: 127.0.0.1' || true)"
          echo "host_ip=127.0.0.1 的发布端口数: $got"
          [ "$got" -eq 2 ] || { echo "!! 预期 2 个发布端口绑定 127.0.0.1，实际 $got"; exit 1; }

      - name: 防火墙来源取自 LAN_CIDR（ADR-028 L3，dry-run）
        run: |
          d="$RUNNER_TEMP/orzmc-bind"
          out="$(./orzmc.sh -d "$d" firewall apply --dry-run)"
          echo "$out"
          echo "$out" | grep -q '192.168.0.0/24' || { echo "!! dry-run 未包含 LAN_CIDR"; exit 1; }
          if echo "$out" | grep -q '0\.0\.0\.0/0'; then
            echo "!! 规则来源不得为全放行（0.0.0.0/0）"; exit 1
          fi
          echo "防火墙 dry-run 来源限定正常"

  windows-branch:
    name: Windows branch logic (ADR-016 / ADR-029)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Windows 分支单元测试
        run: |
          bash tests/windows_ci.sh

  # ---------------------------------------------------------------------------
  # 打包发布（ADR-018）：打 tag（v*）时把"运行时"打成 tarball + sha256，
  # 上传为 GitHub Release 资产，供免克隆部署（install.sh 下载校验解压）。
  # ---------------------------------------------------------------------------
  package:
    name: Build release tarball
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建/更新 Release 与资产
    steps:
      - uses: actions/checkout@v4

      - name: Build tarball (runtime only, no .git/secrets)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${TAG:-0.0.0}"
          # 打包"运行时"：入口脚本 + lib + templates + compose + 文档。
          # 显式排除 .git/.github/tests/数据（铁律：密钥与数据不入包）。
          # 文件清单必须与仓库实际文件一致（删脚本时同步删这里，否则 tar 直接失败）。
          tar --exclude='./.git' --exclude='./.github' --exclude='./tests' \
              --exclude='./.env' --exclude='./.local-data' --exclude='./.local-data-lan' \
              --exclude='./.local-backups' \
              -czf "orzmc-${VERSION}.tar.gz" \
              AGENTS.md CLAUDE.md README.md CHANGELOG.md .gitignore \
              orzmc.sh deploy.sh backup.sh restore.sh update-image-digests.sh install.sh \
              lib templates compose.yaml docs
          sha256sum "orzmc-${VERSION}.tar.gz" > "orzmc-${VERSION}.tar.gz.sha256"
          echo "=== 打包内容 ==="
          tar -tzf "orzmc-${VERSION}.tar.gz" | head -20
          echo "..."
          echo "=== 校验：包内不得有 .git / 数据 / 密钥 ==="
          if tar -tzf "orzmc-${VERSION}.tar.gz" | grep -E '(^|/)(\.git|\.env|\.local-data|\.local-backups)(/|$)' ; then
            echo "!! 包内发现禁止路径" >&2; exit 1
          fi
          echo "禁止路径守卫 OK"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish to GitHub Release (create or update)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            orzmc-${{ env.VERSION }}.tar.gz
            orzmc-${{ env.VERSION }}.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
