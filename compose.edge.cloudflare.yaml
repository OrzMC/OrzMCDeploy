# ===========================================================================
# EDGE=cloudflare 边缘层 override：cloudflared 出站隧道（Cloudflare Tunnel）
#
# 由 lib/common.sh 的 compose_cmd 在 EDGE=cloudflare 时追加合并：
#   docker compose -f compose.yaml -f compose.edge.cloudflare.yaml --profile <ENABLE_*>
# 生产使用：Cloudflare 边缘终止真实 HTTPS，宿主机无需开放端口、无需 ACME。
# 与 EDGE=local / lan 互斥（一次只选一个 EDGE）。
# ===========================================================================

services:
  # ---- cloudflared 出站隧道（Cloudflare Tunnel）---------------------------
  cloudflared:
    image: cloudflare/cloudflared@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    container_name: orzmc-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    dns:
      # 宿主 DNS 可能被本地 fake-ip 代理（Clash/Surge 类）拦截成 198.18.0.0/15 假地址，
      # 会导致边缘主机名解析到假 IP、QUIC 控制连接失败（隧道 530）。显式用公网 DNS 解析
      # Cloudflare 边缘，绕开被劫持的宿主解析路径。解析器在 .env 用 DNS_PRIMARY /
      # DNS_SECONDARY 覆盖（默认 223.5.5.5 阿里优先、1.1.1.1 Cloudflare 兜底）；
      # 无 fake-ip 代理的干净宿主可删掉本块，走默认 Docker DNS。
      - ${DNS_PRIMARY:-223.5.5.5}
      - ${DNS_SECONDARY:-1.1.1.1}
    volumes:
      # 配置由 init 生成；cert.pem 与隧道凭据 <id>.json 同目录（含密钥，随数据备份）
      - "${DATA_ROOT}/cloudflared:/etc/cloudflared:ro"
    depends_on:
      - mcsmanager-web
      - mcsmanager-daemon
