# ===========================================================================
# OrzMC 平台层编排（仅承载"运行时"）
#
# 架构原则：本文件与仓库只描述运行时；全部配置与数据通过卷映射落在宿主机
# 统一目录 $DATA_ROOT（生产默认 /srv/orzmc）。详见 README"运行时/数据分离"。
#
# 统一通过 deploy.sh / local.sh 启动，保证 --env-file $DATA_ROOT/.env 与
# 边缘层配置前置就绪（见 lib/common.sh）。
#
# 双 Profile：
#   - local：reverse-proxy(Caddy) 反代 + 本地 CA（.localhost），仅本地验证使用
#   - prod ：cloudflared 出站隧道，Cloudflare 边缘终止真实 HTTPS，生产使用
#   mcsmanager-*、easybot、mariadb 与 status 无 profile，两种模式都运行。
# 公网/本地暴露 4 个入口：mcs 面板、easybot 后台、mcs-node（daemon 浏览器直连入口，
# 密钥鉴权）与 status（统一状态页，Gatus，实时健康，无鉴权仅状态，不含密钥）；
# EasyBot 插件 API 仅内网（插件挂 orzmc_default 直连 http://easybot:8080）；
# mariadb（默认启用，插件应用数据库）同样仅内网，插件挂 orzmc_default 直连 mariadb:3306。
# ===========================================================================

name: orzmc

services:
  # ---- local profile：Caddy 反代（.localhost + 本地 CA）--------------------
  reverse-proxy:
    profiles: ["local"]
    image: caddy@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    container_name: orzmc-caddy
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT}:80"
      - "${PROXY_HTTPS_PORT}:443"
    environment:
      TZ: "${TZ}"
      CADDY_EMAIL: "${CADDY_EMAIL}"
      DOMAIN_EASY_ADMIN: "${DOMAIN_EASY_ADMIN}"
      DOMAIN_MCS_WEB: "${DOMAIN_MCS_WEB}"
      DOMAIN_MCS_NODE: "${DOMAIN_MCS_NODE}"
      DOMAIN_STATUS: "${DOMAIN_STATUS}"
      EASYBOT_PORT: "${EASYBOT_PORT}"
      MCS_WEB_PORT: "${MCS_WEB_PORT}"
      MCS_DAEMON_PORT: "${MCS_DAEMON_PORT}"
      STATUS_PORT: "${STATUS_PORT}"
    volumes:
      - "${DATA_ROOT}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "${DATA_ROOT}/caddy/data:/data"
      - "${DATA_ROOT}/caddy/config:/config"
    depends_on:
      - mcsmanager-web
      - mcsmanager-daemon
      - easybot
      - status

  # ---- prod profile：cloudflared 出站隧道（Cloudflare Tunnel）---------------
  cloudflared:
    profiles: ["prod"]
    image: cloudflare/cloudflared@sha256:2535e54b16adf1d50630f99d0886471926c5ef3f6b328100ec6589f731c48969
    container_name: orzmc-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    dns:
      # 宿主 DNS 可能被本地 fake-ip 代理（Clash/Surge 类）拦截成 198.18.0.0/15 假地址，
      # 会导致边缘主机名解析到假 IP、QUIC 控制连接失败（隧道 530）。显式用公网 DNS 解析
      # Cloudflare 边缘：223.5.5.5（阿里，国内可达）优先，1.1.1.1（Cloudflare）兜底。
      - 223.5.5.5
      - 1.1.1.1
    volumes:
      # 配置由 init 生成；cert.pem 与隧道凭据 <id>.json 同目录（含密钥，随数据备份）
      - "${DATA_ROOT}/cloudflared:/etc/cloudflared:ro"

  mcsmanager-web:
    image: githubyumao/mcsmanager-web@sha256:4df0d86b59f7da423b838516e20c024b56352a0b5e54fb6c77f6f0a31f618555
    container_name: orzmc-mcsmanager-web
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
    expose:
      - "${MCS_WEB_PORT}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - "${DATA_ROOT}/mcsmanager/web/data:/opt/mcsmanager/web/data"
      - "${DATA_ROOT}/mcsmanager/web/logs:/opt/mcsmanager/web/logs"

  mcsmanager-daemon:
    image: githubyumao/mcsmanager-daemon@sha256:70c69471142047e1670e85858cd0ca64d2ff396566f63c4d2abb489ea37d65cf
    container_name: orzmc-mcsmanager-daemon
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      # MCSM_DOCKER_WORKSPACE_PATH 须为宿主路径（docker bind Source 由宿主解析）。
      # 本仓库实例 cwd 直接用宿主路径（见下方 instances 自挂载），此变量仅兜底
      # MCSManager 默认 data/InstanceData/<uuid> 布局时用。
      MCSM_DOCKER_WORKSPACE_PATH: "${DATA_ROOT}/instances"
    expose:
      - "${MCS_DAEMON_PORT}"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - "${DATA_ROOT}/mcsmanager/daemon/data:/opt/mcsmanager/daemon/data"
      - "${DATA_ROOT}/mcsmanager/daemon/logs:/opt/mcsmanager/daemon/logs"
      # 实例数据以同路径挂进 daemon 容器：MCSManager 文件管理器读 daemon 容器内
      # 的 instance.absoluteCwdPath()（本仓库实例 cwd = ${DATA_ROOT}/instances/...），
      # 自挂载后 daemon 能看到真实文件；docker bind Source 仍由宿主解析，互不冲突。
      - "${DATA_ROOT}/instances:${DATA_ROOT}/instances"
      - /var/run/docker.sock:/var/run/docker.sock

  easybot:
    # 依赖 EasyBot ≥0.0.35（镜像 digest 锁定，勿回退到更低版本；升级见 update-image-digests.sh）
    image: ghcr.io/easyindie/easybot@sha256:afa77d6641c4ff0317414687fa435e6c982599538adf7ffc89bf526faf241ac2
    container_name: orzmc-easybot
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      # 发布镜像硬性要求 EASYBOT_ALLOW_PLAINTEXT=true；监听器仅 HTTP，TLS 由
      # 边缘层承担（local=Caddy / prod=Cloudflare 边缘）。端口只 expose 不发布到
      # 宿主机；插件（挂 orzmc_default）内网直连 http://easybot:8080。
      EASYBOT_ALLOW_PLAINTEXT: "true"
      EASYBOT_HOME: "/var/lib/easybot"
      EASYBOT_ADMIN_PASSWORD: "${EASYBOT_ADMIN_PASSWORD}"
      # QQ 适配器使用 QQ 开放平台凭据（复用 QQBOT_* 变量）
      QQ_APP_ID: "${QQBOT_APP_ID}"
      QQ_CLIENT_SECRET: "${QQBOT_CLIENT_SECRET}"
    expose:
      - "${EASYBOT_PORT}"
    volumes:
      - "${DATA_ROOT}/easybot/data:/var/lib/easybot"

  # ---- 应用数据库：MariaDB（默认启用，随平台层常驻）------------------------
  # 仅内网 orzmc_default 可达 mariadb:3306；不发布宿主机端口、不设公网/边缘入口。
  # PaperMC 插件（Dynmap/CoreProtect/LuckPerms/Towny/economy 等）需要 MySQL/MariaDB
  # 时，实例挂 orzmc_default，JDBC 用 jdbc:mysql://mariadb:3306/<MARIADB_DATABASE>。
  # 数据在 $DATA_ROOT/database/mariadb（随整机备份）；逻辑备份由 backup.sh 自动产出。
  mariadb:
    image: mariadb@sha256:67873d30a17f6a9c331f06363b2fa15f38abca415529966d67c84f87f82439fe
    container_name: orzmc-mariadb
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
    expose:
      - "3306"
    volumes:
      - "${DATA_ROOT}/database/mariadb:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- 统一首页/状态页：Gatus（无 profile，双 profile 都运行）---------------
  # 页头按钮聚合产品入口 + 实时健康卡片；配置 $DATA_ROOT/status/config.yaml 由
  # init 生成（按 profile 替换公网/本地链接与 TLS 校验），绝不覆盖已有文件。
  # scratch 镜像无 shell/curl，不设 compose healthcheck（页面本身即存活信号）。
  status:
    image: twinproduction/gatus@sha256:0009b90a11c042809f7f988c05c3f398dbf24b7498a0b7083efe3b9e8e126550
    container_name: orzmc-status
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
    expose:
      - "${STATUS_PORT}"
    volumes:
      - "${DATA_ROOT}/status/config.yaml:/config/config.yaml:ro"
    depends_on:
      - mcsmanager-web
      - mcsmanager-daemon
      - easybot
      - mariadb
    extra_hosts:
      # local：容器内把 *.localhost 解析到宿主（Caddy 非特权端口），健康检查走真实入口；
      # prod 下这些主机名未使用，无副作用。host-gateway 需 Docker ≥20.10（Desktop ≥4.x）。
      - "mcs.localhost:host-gateway"
      - "easybot.localhost:host-gateway"
      - "mcs-node.localhost:host-gateway"
      # 游戏实例端口由 MCSManager 映射在宿主机，经 host-gateway 探测真实进服口
      - "host.docker.internal:host-gateway"
