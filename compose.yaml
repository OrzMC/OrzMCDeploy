# ===========================================================================
# OrzMC 平台层编排（仅承载"运行时"）
#
# 架构原则：本文件与仓库只描述运行时；全部配置与数据通过卷映射落在宿主机
# 统一目录 $DATA_ROOT（生产默认 /srv/orzmc）。详见 README"运行时/数据分离"。
#
# 统一通过 orzmc.sh / deploy.sh 启动，保证 --env-file $DATA_ROOT/.env 与
# 边缘层配置前置就绪（见 lib/common.sh）。
#
# Profile 模型（ADR-017 起）：单 profile + 可插拔服务 + 可插拔边缘层。
#   - 本文件含核心服务（mcsmanager-web / mcsmanager-daemon，无 profile 常驻）
#     与可选服务（easybot / mariadb / status，带 profiles: ["<name>"] 标签，
#     由 .env 的 ENABLE_* 决定是否启用，compose_cmd 按需追加 --profile）。
#   - 边缘层独立成 override 文件，由 .env 的 EDGE 选择：
#       EDGE=local      → compose.edge.local.yaml      （Caddy，.localhost）
#       EDGE=cloudflare → compose.edge.cloudflare.yaml  （cloudflared 隧道）
#       EDGE=lan        → compose.edge.lan.yaml         （4 源站发宿主端口，纯 HTTP）
#       EDGE=none       → 不追加（仅内网 orzmc_default，不对外）
#   compose_cmd 负责按 EDGE + ENABLE_* 拼出完整的 -f / --profile 集合。
# 公网/本地暴露 4 个入口：mcs 面板、easybot 后台、mcs-node（daemon 浏览器直连入口，
# 密钥鉴权）与 status（统一状态页，Gatus，实时健康，无鉴权仅状态，不含密钥）；
# EasyBot 插件 API 仅内网（插件挂 orzmc_default 直连 http://easybot:8080）；
# mariadb（默认启用，插件应用数据库）同样仅内网，插件挂 orzmc_default 直连 mariadb:3306。
# ===========================================================================

name: orzmc

services:
  mcsmanager-web:
    image: githubyumao/mcsmanager-web@sha256:4df0d86b59f7da423b838516e20c024b56352a0b5e54fb6c77f6f0a31f618555
    container_name: orzmc-mcsmanager-web
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
    expose:
      - "${MCS_WEB_PORT}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - "${DATA_ROOT}/mcsmanager/web/data:/opt/mcsmanager/web/data"
      - "${DATA_ROOT}/mcsmanager/web/logs:/opt/mcsmanager/web/logs"
    extra_hosts:
      # local：面板服务端（容器）连 daemon 走节点地址 wss://mcs-node.localhost:18443（Caddy，
      # 与浏览器同一地址，ADR-013）；容器内把 mcs-node.localhost 解析到宿主（Caddy 非特权端口）。
      # host-gateway 需 Docker ≥20.10（Desktop ≥4.x）；prod/lan 下该主机名未使用，无副作用。
      - "mcs-node.localhost:host-gateway"

  mcsmanager-daemon:
    image: githubyumao/mcsmanager-daemon@sha256:70c69471142047e1670e85858cd0ca64d2ff396566f63c4d2abb489ea37d65cf
    container_name: orzmc-mcsmanager-daemon
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
    expose:
      - "${MCS_DAEMON_PORT}"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - "${DATA_ROOT}/mcsmanager/daemon/data:/opt/mcsmanager/daemon/data"
      - "${DATA_ROOT}/mcsmanager/daemon/logs:/opt/mcsmanager/daemon/logs"
      - /var/run/docker.sock:/var/run/docker.sock

  # ---- 可选服务（ENABLE_* 控制，见 .env）--------------------------------
  # 以下三个服务带 profiles 标签：默认由 compose_cmd 按 ENABLE_* 追加 --profile 启用。
  # 核心 web/daemon 无 profile 常驻，不随 ENABLE_* 变化。

  easybot:
    # 依赖 EasyBot ≥0.0.35（镜像 digest 锁定，勿回退到更低版本；升级见 update-image-digests.sh）
    # ENABLE_EASYBOT=true 时启用（compose_cmd 追加 --profile easybot）
    profiles: ["easybot"]
    image: ghcr.io/easyindie/easybot@sha256:cd0b4e445742ec6fb93a4d2ec351fa21fc892caf228dc4c56bd4d41c4c87405a
    container_name: orzmc-easybot
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      # 发布镜像硬性要求 EASYBOT_ALLOW_PLAINTEXT=true；监听器仅 HTTP，TLS 由
      # 边缘层承担（EDGE=local=Caddy / cloudflare=Cloudflare 边缘；EDGE=lan 无边缘层，
      # 纯 HTTP，仅限可信局域网）。端口只 expose 不发布到宿主机（EDGE=local/cloudflare；
      # EDGE=lan 经 compose.edge.lan.yaml 发布宿主端口）；插件（挂 orzmc_default）
      # 内网直连 http://easybot:8080。
      EASYBOT_ALLOW_PLAINTEXT: "true"
      EASYBOT_HOME: "/var/lib/easybot"
      EASYBOT_ADMIN_PASSWORD: "${EASYBOT_ADMIN_PASSWORD}"
      # QQ 适配器使用 QQ 开放平台凭据（复用 QQBOT_* 变量）
      QQ_APP_ID: "${QQBOT_APP_ID}"
      QQ_CLIENT_SECRET: "${QQBOT_CLIENT_SECRET}"
    expose:
      - "${EASYBOT_PORT}"
    volumes:
      - "${DATA_ROOT}/easybot/data:/var/lib/easybot"

  # ---- 应用数据库：MariaDB（ENABLE_MARIADB=true 时启用）------------------
  # 仅内网 orzmc_default 可达 mariadb:3306；不发布宿主机端口、不设公网/边缘入口。
  # PaperMC 插件（Dynmap/CoreProtect/LuckPerms/Towny/economy 等）需要 MySQL/MariaDB
  # 时，实例挂 orzmc_default，JDBC 用 jdbc:mysql://mariadb:3306/<MARIADB_DATABASE>。
  # 数据在 $DATA_ROOT/database/mariadb（随整机备份）；逻辑备份由 backup.sh 自动产出。
  mariadb:
    profiles: ["mariadb"]
    image: mariadb@sha256:67873d30a17f6a9c331f06363b2fa15f38abca415529966d67c84f87f82439fe
    container_name: orzmc-mariadb
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
    expose:
      - "3306"
    volumes:
      - "${DATA_ROOT}/database/mariadb:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- 统一首页/状态页：Gatus（ENABLE_STATUS=true 时启用）-----------------
  # 页头按钮聚合产品入口 + 实时健康卡片；配置 $DATA_ROOT/status/config.yaml 由
  # init 生成（按 EDGE 替换公网/本地链接与 TLS 校验），绝不覆盖已有文件。
  # scratch 镜像无 shell/curl，不设 compose healthcheck（页面本身即存活信号）。
  # 仅 depends_on 核心 web/daemon（不依赖可选服务，避免 ENABLE_* 禁用时依赖报错）。
  status:
    profiles: ["status"]
    image: twinproduction/gatus@sha256:0009b90a11c042809f7f988c05c3f398dbf24b7498a0b7083efe3b9e8e126550
    container_name: orzmc-status
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
    expose:
      - "${STATUS_PORT}"
    volumes:
      - "${DATA_ROOT}/status/config.yaml:/config/config.yaml:ro"
    depends_on:
      - mcsmanager-web
      - mcsmanager-daemon
    extra_hosts:
      # local：容器内把 *.localhost 解析到宿主（Caddy 非特权端口），健康检查走真实入口；
      # prod 下这些主机名未使用，无副作用。host-gateway 需 Docker ≥20.10（Desktop ≥4.x）。
      - "mcs.localhost:host-gateway"
      - "easybot.localhost:host-gateway"
      - "mcs-node.localhost:host-gateway"
      # 游戏实例端口由 MCSManager 映射在宿主机，经 host-gateway 探测真实进服口
      - "host.docker.internal:host-gateway"
