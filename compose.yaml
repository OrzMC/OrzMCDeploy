# ===========================================================================
# OrzMC 平台层编排（只承载"运行时"；全部数据经卷映射落 $DATA_ROOT）
#
# 统一通过 ./orzmc.sh 启动（显式 --env-file $DATA_ROOT/.env，见 lib/common.sh）。
# 拓扑/数据流见 docs/architecture.md §2；本文件只保留必要注释。
#
# 宿主发布端口只有两个（LAN_BIND_ADDR 控制绑定地址，ADR-027/028）：
#   面板 LAN_MCS_WEB_PORT→23333、EasyBot LAN_EASYBOT_PORT→8080
# daemon 24444 不发布（面板中转数据面，ADR-026）；easybot 由 ENABLE_EASYBOT 开关
# （compose_cmd 追加 --profile easybot），核心 web/daemon 常驻。
# ===========================================================================

name: orzmc

services:
  mcsmanager-web:
    deploy:
      resources:
        limits:
          memory: 512M      # 防御性保险丝：面板占用平稳，固定上限即可
    image: githubyumao/mcsmanager-web@sha256:c3de64da162927a2386f9b036791f2eaeb610129d8742395fed4baad24678c64
    container_name: orzmc-mcsmanager-web
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
    ports:
      - "${LAN_BIND_ADDR:-0.0.0.0}:${LAN_MCS_WEB_PORT:-18090}:${MCS_WEB_PORT}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - "${DATA_ROOT}/mcsmanager/web/data:/opt/mcsmanager/web/data"
      - "${DATA_ROOT}/mcsmanager/web/logs:/opt/mcsmanager/web/logs"

  mcsmanager-daemon:
    # 容器内存上限与 Node 堆上限必须成对（issue #10 / ADR-022），缺省 512M / 384；
    # 升级镜像后若默认 CMD 变化，需同步核对下方 command。
    deploy:
      resources:
        limits:
          memory: "${DAEMON_MEMORY_LIMIT:-512M}"
    image: githubyumao/mcsmanager-daemon@sha256:f6fd2facb03029a12b86c6c836d37f57b1608c68d8dc8abbc8e1539e5d12fae3
    container_name: orzmc-mcsmanager-daemon
    restart: unless-stopped
    # 覆盖镜像默认 CMD（原为 --max-old-space-size=8192）才能真正降堆：
    # 命令行 flag 优先级高于 NODE_OPTIONS（只设 env 无效）。
    command: ["node", "--max-old-space-size=${DAEMON_NODE_HEAP_MB:-384}", "app.js"]
    environment:
      TZ: "${TZ}"
      # docker 型实例的 cwd 宿主↔容器路径翻译；缺失时建实例报
      # "bind source path does not exist"（ADR-019）。
      MCSM_DOCKER_WORKSPACE_PATH: "${DATA_ROOT}/mcsmanager/daemon/data/InstanceData"
    healthcheck:
      # TCP 探活（用镜像自带 node，无需 curl）；被 cgroup OOM kill 时转为 unhealthy。
      test:
        - CMD-SHELL
        - node -e 'const s=require("net").connect(Number("${MCS_DAEMON_PORT:-24444}"),"127.0.0.1");s.on("connect",()=>{s.destroy();process.exit(0)});s.on("error",()=>process.exit(1));s.setTimeout(3000,()=>process.exit(1));'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - "${DATA_ROOT}/mcsmanager/daemon/data:/opt/mcsmanager/daemon/data"
      - "${DATA_ROOT}/mcsmanager/daemon/logs:/opt/mcsmanager/daemon/logs"
      - /var/run/docker.sock:/var/run/docker.sock

  easybot:
    # 可选服务：ENABLE_EASYBOT=true 时由 compose_cmd 追加 --profile easybot。
    # 上限刻意保持紧（ADR-024）：放大只会让未来的内存回归更晚暴露。
    profiles: ["easybot"]
    deploy:
      resources:
        limits:
          memory: "${EASYBOT_MEMORY_LIMIT:-512M}"
    image: ghcr.io/easyindie/easybot@sha256:85e9e3fa2faafd3861c998b57be30c8cdafa3b8eac1e214ad9209026ae3506bc
    container_name: orzmc-easybot
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      # 发布镜像硬性要求；监听器仅 HTTP（局域网可信内网，ADR-027）。
      EASYBOT_ALLOW_PLAINTEXT: "true"
      EASYBOT_HOME: "/var/lib/easybot"
      EASYBOT_ADMIN_PASSWORD: "${EASYBOT_ADMIN_PASSWORD}"
      QQ_APP_ID: "${QQBOT_APP_ID}"
      QQ_CLIENT_SECRET: "${QQBOT_CLIENT_SECRET}"
    ports:
      - "${LAN_BIND_ADDR:-0.0.0.0}:${LAN_EASYBOT_PORT:-18091}:${EASYBOT_PORT}"
    volumes:
      - "${DATA_ROOT}/easybot/data:/var/lib/easybot"
