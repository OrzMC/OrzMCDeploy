# ===========================================================================
# OrzMC 平台层编排（仅承载"运行时"）
#
# 架构原则：本文件与仓库只描述运行时；全部配置与数据通过卷映射落在宿主机
# 统一目录 $DATA_ROOT（生产默认 /srv/orzmc）。详见 README"运行时/数据分离"。
#
# 统一通过 deploy.sh / local.sh 启动，保证 --env-file $DATA_ROOT/.env 与
# 边缘层配置前置就绪（见 lib/common.sh）。
#
# 双 Profile：
#   - local：reverse-proxy(Caddy) 反代 + 本地 CA（.localhost），仅本地验证使用
#   - prod ：cloudflared 出站隧道，Cloudflare 边缘终止真实 HTTPS，生产使用
#   mcsmanager-* 与 easybot 无 profile，两种模式都运行。
# 公网/本地暴露 3 个入口：mcs 面板、easybot 后台、mcs-node（daemon 浏览器直连入口，
# 密钥鉴权）；EasyBot 插件 API 仅内网（插件挂 orzmc_default 直连 http://easybot:8080）。
# ===========================================================================

name: orzmc

services:
  # ---- local profile：Caddy 反代（.localhost + 本地 CA）--------------------
  reverse-proxy:
    profiles: ["local"]
    image: caddy@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    container_name: orzmc-caddy
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT}:80"
      - "${PROXY_HTTPS_PORT}:443"
    environment:
      TZ: "${TZ}"
      CADDY_EMAIL: "${CADDY_EMAIL}"
      DOMAIN_EASY_ADMIN: "${DOMAIN_EASY_ADMIN}"
      DOMAIN_MCS_WEB: "${DOMAIN_MCS_WEB}"
      EASYBOT_PORT: "${EASYBOT_PORT}"
      MCS_WEB_PORT: "${MCS_WEB_PORT}"
      MCS_DAEMON_PORT: "${MCS_DAEMON_PORT}"
    volumes:
      - "${DATA_ROOT}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "${DATA_ROOT}/caddy/data:/data"
      - "${DATA_ROOT}/caddy/config:/config"
    depends_on:
      - mcsmanager-web
      - mcsmanager-daemon
      - easybot

  # ---- prod profile：cloudflared 出站隧道（Cloudflare Tunnel）---------------
  cloudflared:
    profiles: ["prod"]
    image: cloudflare/cloudflared@sha256:2535e54b16adf1d50630f99d0886471926c5ef3f6b328100ec6589f731c48969
    container_name: orzmc-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      # 配置由 init 生成；cert.pem 与隧道凭据 <id>.json 同目录（含密钥，随数据备份）
      - "${DATA_ROOT}/cloudflared:/etc/cloudflared:ro"

  mcsmanager-web:
    image: githubyumao/mcsmanager-web@sha256:4df0d86b59f7da423b838516e20c024b56352a0b5e54fb6c77f6f0a31f618555
    container_name: orzmc-mcsmanager-web
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
    expose:
      - "${MCS_WEB_PORT}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - "${DATA_ROOT}/mcsmanager/web/data:/opt/mcsmanager/web/data"
      - "${DATA_ROOT}/mcsmanager/web/logs:/opt/mcsmanager/web/logs"

  mcsmanager-daemon:
    image: githubyumao/mcsmanager-daemon@sha256:70c69471142047e1670e85858cd0ca64d2ff396566f63c4d2abb489ea37d65cf
    container_name: orzmc-mcsmanager-daemon
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      # MCSM_DOCKER_WORKSPACE_PATH 须为宿主路径（docker bind Source 由宿主解析）。
      # 本仓库实例 cwd 直接用宿主路径（见下方 instances 自挂载），此变量仅兜底
      # MCSManager 默认 data/InstanceData/<uuid> 布局时用。
      MCSM_DOCKER_WORKSPACE_PATH: "${DATA_ROOT}/instances"
    expose:
      - "${MCS_DAEMON_PORT}"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - "${DATA_ROOT}/mcsmanager/daemon/data:/opt/mcsmanager/daemon/data"
      - "${DATA_ROOT}/mcsmanager/daemon/logs:/opt/mcsmanager/daemon/logs"
      # 实例数据以同路径挂进 daemon 容器：MCSManager 文件管理器读 daemon 容器内
      # 的 instance.absoluteCwdPath()（本仓库实例 cwd = ${DATA_ROOT}/instances/...），
      # 自挂载后 daemon 能看到真实文件；docker bind Source 仍由宿主解析，互不冲突。
      - "${DATA_ROOT}/instances:${DATA_ROOT}/instances"
      - /var/run/docker.sock:/var/run/docker.sock

  easybot:
    image: ghcr.io/easyindie/easybot@sha256:fe201867ced7175b29d9f1ebe0461cee041c95b936e5ccd148cbbc095940efc4
    container_name: orzmc-easybot
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      # 发布镜像硬性要求 EASYBOT_ALLOW_PLAINTEXT=true；监听器仅 HTTP，TLS 由
      # 边缘层承担（local=Caddy / prod=Cloudflare 边缘）。端口只 expose 不发布到
      # 宿主机；插件（挂 orzmc_default）内网直连 http://easybot:8080。
      EASYBOT_ALLOW_PLAINTEXT: "true"
      EASYBOT_HOME: "/var/lib/easybot"
      EASYBOT_ADMIN_PASSWORD: "${EASYBOT_ADMIN_PASSWORD}"
      # QQ 适配器使用 QQ 开放平台凭据（复用 QQBOT_* 变量）
      QQ_APP_ID: "${QQBOT_APP_ID}"
      QQ_CLIENT_SECRET: "${QQBOT_CLIENT_SECRET}"
    expose:
      - "${EASYBOT_PORT}"
    volumes:
      - "${DATA_ROOT}/easybot/data:/var/lib/easybot"
