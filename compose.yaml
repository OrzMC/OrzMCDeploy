# ===========================================================================
# OrzMC 平台层编排（仅承载"运行时"）
#
# 架构原则：本文件与仓库只描述运行时；全部配置与数据通过卷映射落在宿主机
# 统一目录 $DATA_ROOT（生产默认 /srv/orzmc）。详见 README"运行时/数据分离"。
#
# 统一通过 orzmc.sh 启动，保证 --env-file $DATA_ROOT/.env 前置就绪（见 lib/common.sh）。
#
# 运行模型（ADR-027）：**只有局域网模式**——面板与 EasyBot 发布到宿主端口，
# 纯 HTTP，局域网设备直连；对外访问由站点自备（DDNS + 端口映射 / 反代 / VPN）。
#   - 核心服务：mcsmanager-web / mcsmanager-daemon（常驻，无 profile）
#   - 可选服务：easybot（`profiles: ["easybot"]`，由 .env 的 ENABLE_EASYBOT 控制）
#   - **daemon 不发布宿主端口**：ADR-026 起面板自己中转浏览器↔daemon 数据流
#     （SystemConfig.dataPlane=proxy），节点地址固定内网名。
#   - ADR-025 起平台层不再内置数据库与状态页。
# 局域网暴露 2 个入口：mcs 面板（LAN_MCS_WEB_PORT）、easybot（LAN_EASYBOT_PORT）；
# EasyBot 插件 API 仅内网（插件挂 orzmc_default 直连 http://easybot:8080）。
# ===========================================================================

name: orzmc

services:
  mcsmanager-web:
    # 资源上限（2026-09-03：Docker Desktop VM 扩容 8G/4vCPU 后加装防御性保险丝）
    deploy:
      resources:
        limits:
          memory: 512M
    image: githubyumao/mcsmanager-web@sha256:c3de64da162927a2386f9b036791f2eaeb610129d8742395fed4baad24678c64
    container_name: orzmc-mcsmanager-web
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
    expose:
      - "${MCS_WEB_PORT}"
    ports:
      # 局域网直连（ADR-027）：宿主端口 → 容器端口，纯 HTTP、仅可信内网
      - "${LAN_MCS_WEB_PORT:-18090}:${MCS_WEB_PORT}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - "${DATA_ROOT}/mcsmanager/web/data:/opt/mcsmanager/web/data"
      - "${DATA_ROOT}/mcsmanager/web/logs:/opt/mcsmanager/web/logs"

  mcsmanager-daemon:
    # 资源上限（2026-09-03：Docker Desktop VM 扩容 8G/4vCPU 后加装防御性保险丝）
    # 与下方 NODE_HEAP 对齐：两者均由 .env 派生，避免「容器上限 / Node 堆上限」两处漂移
    # （issue #10）。默认 512M / 384（384 留出堆外内存余量）。
    deploy:
      resources:
        limits:
          memory: "${DAEMON_MEMORY_LIMIT:-512M}"
    image: githubyumao/mcsmanager-daemon@sha256:f6fd2facb03029a12b86c6c836d37f57b1608c68d8dc8abbc8e1539e5d12fae3
    container_name: orzmc-mcsmanager-daemon
    restart: unless-stopped
    # issue #10：镜像默认 CMD 是 `node app.js --max-old-space-size=8192`（8G），在 512M
    # cgroup 上限下重负载有被 OOM kill 风险（daemon 无健康检查兜底时实例会失去跟踪）。
    # 必须**覆盖 CMD** 才能真正降堆：命令行 flag 优先级高于 NODE_OPTIONS（env 方案无效）。
    # 若镜像升级后 CMD 改变，需同步核对本行（update-image-digests.sh 后回归）。
    command: ["node", "--max-old-space-size=${DAEMON_NODE_HEAP_MB:-384}", "app.js"]
    environment:
      TZ: "${TZ}"
      # Docker 实例 cwd 路径翻译（daemon 源码读取）：daemon 容器内
      # /opt/mcsmanager/daemon/data/InstanceData/<uuid> → 宿主
      # $DATA_ROOT/mcsmanager/daemon/data/InstanceData/<uuid>。
      # 缺失时 docker 实例 bind source 用容器内路径，宿主引擎报
      # "bind source path does not exist"（ADR-019 移除旧 instances 方案时误删）。
      MCSM_DOCKER_WORKSPACE_PATH: "${DATA_ROOT}/mcsmanager/daemon/data/InstanceData"
    healthcheck:
      # TCP 探活 daemon 端口（node 内置模块，镜像自带 node，无需 curl/wget）；
      # 重负载被 cgroup OOM kill 时转为 unhealthy，便于及时发现（issue #10）。
      test:
        - CMD-SHELL
        - node -e 'const s=require("net").connect(Number("${MCS_DAEMON_PORT:-24444}"),"127.0.0.1");s.on("connect",()=>{s.destroy();process.exit(0)});s.on("error",()=>process.exit(1));s.setTimeout(3000,()=>process.exit(1));'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    expose:
      - "${MCS_DAEMON_PORT}"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - "${DATA_ROOT}/mcsmanager/daemon/data:/opt/mcsmanager/daemon/data"
      - "${DATA_ROOT}/mcsmanager/daemon/logs:/opt/mcsmanager/daemon/logs"
      - /var/run/docker.sock:/var/run/docker.sock

  # ---- 可选服务（ENABLE_EASYBOT 控制，见 .env）---------------------------
  # easybot 带 profiles 标签：默认由 compose_cmd 按 ENABLE_EASYBOT 追加 --profile 启用。
  # 核心 web/daemon 无 profile 常驻，不随 ENABLE_* 变化。

  easybot:
    # 资源上限（issue #16）：由 .env 的 EASYBOT_MEMORY_LIMIT 派生（缺省 512M，与原硬编码值一致）。
    # 刻意保持**紧**上限：EasyBot v0.0.41 已修掉近空载匿名内存泄漏（上游 issue #139），
    # 若随之把上限放大（曾短暂用 1G），反而会**掩盖**未来的内存回归——泄漏应尽快由 OOM/重启
    # 暴露，而不是被余量吞掉。仅当站点确有更重负载时才上调（.env / compose.site.yaml）。
    deploy:
      resources:
        limits:
          memory: "${EASYBOT_MEMORY_LIMIT:-512M}"
    # 依赖 EasyBot ≥0.0.35（镜像 digest 锁定，勿回退到更低版本；升级见 update-image-digests.sh）
    # 钉 v0.0.43（发布 tag 0.0.43 的 digest，非 latest——上游 latest 跟踪 main 分支）：
    #   0.0.41 SQLite 权限加固降级 / 存储降级上报（#121/#122/#123）+ 空载内存泄漏（#139）
    #   0.0.42 QQ 公私域 intent 自动降级探测、Telegram 相册多图（sendMediaGroup）
    #   0.0.43 进程外插件双重 init 导致握手失败（IPC adapter init 幂等化）
    # ENABLE_EASYBOT=true 时启用（compose_cmd 追加 --profile easybot）
    profiles: ["easybot"]
    image: ghcr.io/easyindie/easybot@sha256:85e9e3fa2faafd3861c998b57be30c8cdafa3b8eac1e214ad9209026ae3506bc
    container_name: orzmc-easybot
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      # 发布镜像硬性要求 EASYBOT_ALLOW_PLAINTEXT=true；监听器仅 HTTP（ADR-027 局域网模式，
      # 无边缘层 TLS；要对公网暴露请自行前置反代/VPN）。插件（挂 orzmc_default）
      # 内网直连 http://easybot:8080。
      EASYBOT_ALLOW_PLAINTEXT: "true"
      EASYBOT_HOME: "/var/lib/easybot"
      EASYBOT_ADMIN_PASSWORD: "${EASYBOT_ADMIN_PASSWORD}"
      # QQ 适配器使用 QQ 开放平台凭据（复用 QQBOT_* 变量）
      QQ_APP_ID: "${QQBOT_APP_ID}"
      QQ_CLIENT_SECRET: "${QQBOT_CLIENT_SECRET}"
    expose:
      - "${EASYBOT_PORT}"
    ports:
      - "${LAN_EASYBOT_PORT:-18091}:${EASYBOT_PORT}"
    volumes:
      - "${DATA_ROOT}/easybot/data:/var/lib/easybot"
